  <!-- trace de glisse : arc bleu qui enveloppe la pastille -->
  <path d="M9 46 A 26 26 0 0 0 49 54" fill="none" stroke="#7b8cff" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M6.5 38 A 27 27 0 0 0 9 46" fill="none" stroke="#7b8cff" stroke-width="4.5" stroke-linecap="round" opacity=".45"/>
  <circle cx="34" cy="29" r="21" fill="#f7d154"/>
  <!-- « S » en italique -->
  <g transform="translate(34 29) skewX(-12) translate(-34 -29)">
    <path d="M42 19.5 C 39.5 16.6 34.6 15.8 31.2 17 C 27.4 18.3 26.6 22.6 29.6 24.9 C 32 26.8 36.6 27.4 38.9 29.6 C 42.4 32.9 40.6 38.9 35.4 40.4 C 31.6 41.5 27.2 40.4 25.2 37.6"
      fill="none" stroke="#07080a" stroke-width="5.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
