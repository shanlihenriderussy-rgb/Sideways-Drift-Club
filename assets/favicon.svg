<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe45c"/>
      <stop offset=".5" stop-color="#ffc21f"/>
      <stop offset="1" stop-color="#ff5a1f"/>
    </linearGradient>
    <clipPath id="c"><rect x="2" y="2" width="60" height="60" rx="15"/></clipPath>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/>
  <g clip-path="url(#c)">
    <!-- reflets diagonaux -->
    <path d="M30 -4 L44 -4 L18 68 L4 68 Z" fill="#fff" opacity=".22"/>
    <path d="M48 -4 L53 -4 L27 68 L22 68 Z" fill="#fff" opacity=".18"/>
    <!-- traces de gomme -->
    <path d="M-4 62 C 12 52 24 51 36 53" fill="none" stroke="#0e0d14" stroke-width="3.2" stroke-linecap="round" opacity=".4"/>
    <path d="M-4 54 C 9 45 18 44 28 46" fill="none" stroke="#0e0d14" stroke-width="3.2" stroke-linecap="round" opacity=".4"/>
    <!-- fumée de pneus -->
    <g fill="#fffaf0" stroke="#0e0d14" stroke-width="2.3">
      <circle cx="3" cy="36" r="6"/>
      <circle cx="7" cy="46" r="7.5"/>
      <circle cx="16" cy="54" r="7"/>
      <circle cx="2" cy="56" r="6"/>
    </g>
    <!-- voiture en glisse -->
    <g transform="translate(35 36) rotate(-14) scale(1.14) translate(-34 -34)">
      <path fill="#0e0d14" d="M10 41 L10.5 33.5 L16 31.2 L23 25 Q25 23.4 28 23.2 L36.5 23 Q39 23.1 40.6 24.6 L46 29.6 L55.5 31.6 Q58.6 32.3 58.8 35 L58.6 39.4 Q58.4 41 56.6 41 Z"/>
      <!-- aileron sur montants -->
      <path fill="#0e0d14" d="M12.6 32 L13.4 27 L15.4 27 L15 31.4 Z M8.2 25.4 L20.4 25.4 L20.4 28 L8.2 28.2 Z"/>
      <!-- vitres -->
      <path fill="#ffd23f" d="M26.6 25.6 L35.8 25.3 Q37.6 25.3 38.8 26.4 L42.6 29.7 L24.2 30 Z"/>
      <rect x="31.6" y="25" width="1.7" height="5.2" fill="#0e0d14"/>
      <!-- bande de livrée -->
      <path d="M17 35.6 L54 34 L54 35.4 L17 37 Z" fill="#ff3d3d"/>
      <!-- feux -->
      <rect x="10.2" y="33.4" width="2.8" height="2.8" rx=".6" fill="#ff3d3d"/>
      <rect x="55.2" y="33" width="3.2" height="2" rx=".6" fill="#fff6d6"/>
      <!-- roues -->
      <circle cx="20" cy="41.6" r="5.8" fill="#0e0d14"/>
      <circle cx="20" cy="41.6" r="3" fill="#ffd23f"/>
      <circle cx="20" cy="41.6" r="1.1" fill="#0e0d14"/>
      <circle cx="48.4" cy="41.6" r="5.8" fill="#0e0d14"/>
      <circle cx="48.4" cy="41.6" r="3" fill="#ffd23f"/>
      <circle cx="48.4" cy="41.6" r="1.1" fill="#0e0d14"/>
    </g>
    <!-- lignes de vitesse -->
    <g stroke="#0e0d14" stroke-width="2.6" stroke-linecap="round">
      <path d="M41 11 L57 7.5"/>
      <path d="M48 16.5 L59 14"/>
    </g>
  </g>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="none" stroke="#0e0d14" stroke-width="3"/>
</svg>
