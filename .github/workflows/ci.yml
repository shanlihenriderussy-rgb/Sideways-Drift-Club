name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (imports, noms non définis)
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build et vérification que index.html est à jour
        run: |
          npm run build
          git diff --exit-code index.html || (echo "index.html n'est pas à jour : lancer « npm run build » et committer" && exit 1)

  e2e:
    name: Bout en bout (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Navigateur
        run: npx playwright install --with-deps chromium
      - name: Parcours joueur (accueil, premier run, run noté, atelier, île, multijoueur)
        run: npm run e2e
