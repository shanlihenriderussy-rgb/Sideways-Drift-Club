<title>Sideways Drift Club</title>
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Special+Gothic+Expanded+One&display=swap">
<!-- kanji : sous-ensemble limité aux caractères affichés -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@900&text=%E6%A8%AA%E6%BB%91%E3%82%8A%E5%80%B6%E6%A5%BD%E9%83%A8%E8%B5%B0%E8%A1%8C%E3%82%AB%E3%82%B9%E3%82%BF%E3%83%A0%E8%A8%98%E9%8C%B2%E8%A8%AD%E5%AE%9A%E8%AA%AC%E6%98%8E%E4%BC%91%E6%86%A9%E7%B5%90%E6%9E%9C%E6%BA%96%E5%82%99%E6%93%8D%E4%BD%9C&display=swap">
<style>
/* DA « Presse auto 1995 » : les menus sont des pages de magazine (papier, encre, trame, bandeaux rouges)
   posées sur la scène 3D ; le HUD, des plaques noires à chiffres condensés. Thème unique, assumé. */
:root {
  color-scheme: dark;
  --ink: #0a0a0a;          /* encre, fond principal */
  --ink-2: #161616;
  --paper: #ebe8e1;        /* papier, texte sur fond sombre */
  --paper-2: #dcd7cb;
  --red: #e8433c;          /* bandeaux, alerte, action principale */
  --blue: #3a7bd5;         /* info */
  --tape: #f7d154;         /* jaune : surbrillance, combo, argent */
  --tail: var(--red);
  --clip: #ffb020;         /* zone extérieure (HUD) */
  --apex: #38d6ff;         /* corde intérieure (HUD) */
  --ok: #4be38a;
  /* couleurs de premier plan : redéfinies sur les cartes papier */
  --fg: var(--paper);
  --muted: #b2ada3;
  --line: rgba(235, 232, 225, 0.18);
  --fill: rgba(235, 232, 225, 0.06);
  --font-display: "Anton", "Impact", "Arial Narrow Bold", sans-serif;
  --font-wide: "Special Gothic Expanded One", "Arial Black", sans-serif;
  --font-ui: "Inter", "Segoe UI", system-ui, sans-serif;
  --font-jp: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  --halftone: radial-gradient(rgba(10,10,10,.13) 1.1px, transparent 1.5px) 0 0 / 7px 7px;
  --shadow: 6px 6px 0 rgba(0,0,0,.88);
  --logo: url("%LOGO%"); /* emblème du club, injecté par build.mjs */
  --btn: 76px;
}
[hidden] { display: none !important; }
html, body { height: 100%; touch-action: none; -webkit-touch-callout: none; overscroll-behavior: none; }
button, input, .opt { touch-action: manipulation; }
body { margin: 0; background: var(--ink); color: var(--fg); font-family: var(--font-ui); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--tape); outline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.jp { font-family: var(--font-jp); font-weight: 900; }

/* ---------- écrans : pages de magazine ---------- */
.screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); z-index: 20; }
.screen.dim { background: var(--halftone), rgba(10,10,10,.62); background-blend-mode: normal; }
.select-grid { display: grid; gap: 4px; }
@media (orientation: landscape) and (max-height: 560px) { #select .sub { display: none; } #select h2 { font-size: 26px; margin-bottom: 10px; } .select-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 22px; align-items: start; } #select .card { width: min(900px, 100%); } .card { padding: 16px 20px; } .card .sub { margin-bottom: 12px; } .seg.modes { grid-template-columns: 1fr; } .seg.modes .opt { min-height: 0; padding: 9px 12px; } .track-opt { padding: 8px 10px; } .setting { padding: 8px 0; } }
.card {
  --fg: var(--ink); --muted: #5e594f; --line: rgba(10,10,10,.2); --fill: rgba(10,10,10,.05); --ok: #1b7a43; --apex: #1f5fae; --clip: #b45f00;
  color: var(--fg); background: var(--halftone), linear-gradient(180deg, #efece5, var(--paper) 60%, #e3dfd5);
  border: 3px solid var(--ink); border-radius: 3px; box-shadow: var(--shadow);
  padding: 22px; width: min(560px, 100%); max-height: 100%; overflow: auto; touch-action: pan-y; overscroll-behavior: contain;
}
.card h2 { font-family: var(--font-display); font-weight: 400; font-size: clamp(28px, 5vw, 40px); line-height: 1; margin: 6px 0 8px; letter-spacing: .01em; text-transform: uppercase; text-wrap: balance; }
.card .sub { color: var(--muted); margin: 0 0 18px; font-size: 14.5px; line-height: 1.45; }
/* bandeau de rubrique : étiquette rouge + kanji */
.eyebrow { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-wide); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #fff; background: var(--red); padding: 4px 10px 3px; transform: skewX(-10deg); box-shadow: 3px 3px 0 var(--ink); }
.eyebrow > * { transform: skewX(10deg); }
.eyebrow .jp { font-size: 12px; letter-spacing: .08em; opacity: .9; }

/* ---------- menu titre : couverture de magazine ---------- */
#menu { justify-content: space-between; align-items: flex-end; gap: 24px; background:
  linear-gradient(20deg, rgba(10,10,10,.9) 0%, rgba(10,10,10,.5) 36%, rgba(10,10,10,0) 60%); }
.title-block { display: grid; gap: 14px; max-width: 560px; position: relative; }
.brand { display: flex; align-items: center; gap: 16px; position: relative; }
.brand::before { content: ""; position: absolute; left: clamp(70px, 14vw, 150px); top: 50%; width: clamp(150px, 26vw, 280px); aspect-ratio: 1; border-radius: 50%; background: var(--red); transform: translateY(-50%); opacity: .92; z-index: -1; box-shadow: 0 0 0 6px rgba(10,10,10,.35); }
.emblem { width: clamp(96px, 17vw, 170px); aspect-ratio: 1; flex: none; background: var(--logo) center / contain no-repeat; filter: drop-shadow(4px 5px 0 rgba(0,0,0,.85)); }
.logo { font-family: var(--font-display); font-weight: 400; line-height: .84; font-size: clamp(56px, 11vw, 118px); margin: 0; letter-spacing: -.005em; color: var(--paper); text-shadow: 4px 4px 0 var(--ink), 6px 7px 0 rgba(0,0,0,.4); transform: skewX(-9deg); transform-origin: left bottom; text-transform: uppercase; }
.logo span { display: block; color: var(--ink); background: var(--tape); font-size: .42em; letter-spacing: .06em; margin-top: 8px; padding: 2px 10px 0; width: max-content; text-shadow: none; box-shadow: 4px 4px 0 var(--ink); }
.logo-jp { position: fixed; right: max(16px, env(safe-area-inset-right)); top: max(16px, env(safe-area-inset-top)); writing-mode: vertical-rl; font-family: var(--font-jp); font-weight: 900; font-size: clamp(22px, 4vw, 40px); color: var(--paper); text-shadow: 3px 3px 0 var(--ink); letter-spacing: .08em; pointer-events: none; }
.logo-jp b { color: var(--red); font-weight: 900; }
/* sommaire : bandes de papier numérotées */
.menu-btns { display: grid; gap: 8px; min-width: min(300px, 100%); }
.menu-btns .btn { justify-content: flex-start; width: 100%; }
.menu-btns .no { font-family: var(--font-wide); font-size: 11px; letter-spacing: .08em; opacity: .55; margin-right: 4px; font-style: normal; }
@media (orientation: landscape) { #menu .menu-btns { position: relative; z-index: 1; margin-right: clamp(38px, 6vw, 62px); } }
@media (orientation: portrait) { #menu { flex-direction: column; align-items: stretch; justify-content: flex-end; } #menu .menu-btns { grid-template-columns: 1fr 1fr; } #menu .menu-btns .primary { grid-column: 1 / -1; } }

.btn { appearance: none; border: 2px solid var(--ink); cursor: pointer; min-height: 50px; padding: 0 20px; border-radius: 2px; font-family: var(--font-display); font-weight: 400; font-size: 19px; letter-spacing: .05em; text-transform: uppercase; background: var(--paper); color: var(--ink); transform: skewX(-9deg); box-shadow: 4px 4px 0 var(--ink); transition: transform .1s, box-shadow .1s, background .12s; display: inline-flex; align-items: center; gap: 10px; }
.btn > * { transform: skewX(9deg); display: inline-flex; align-items: baseline; gap: 8px; }
.btn:hover { background: #fff; }
.btn:active { transform: skewX(-9deg) translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
.btn.primary { background: var(--red); color: #fff; font-size: 22px; min-height: 58px; padding: 0 28px; }
.btn.primary:hover { background: #f05048; }
.btn.ghost { background: transparent; color: var(--fg); border-color: currentColor; box-shadow: none; }
.screen:not(.dim) > .btn.ghost, #menu .btn.ghost { color: var(--paper); background: rgba(10,10,10,.55); border-color: var(--paper); }
.hint { color: var(--muted); font-size: 13.5px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
#menu .hint { color: var(--paper); text-shadow: 0 1px 2px #000; }
.kbd { border: 1.5px solid currentColor; border-radius: 2px; padding: 0 5px; font-size: 11.5px; font-family: var(--font-wide); }
.portrait-tip { display: none; }
@media (orientation: portrait) and (max-width: 700px) { .portrait-tip { display: flex; } }

/* ---------- choix ---------- */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
.opt { appearance: none; cursor: pointer; text-align: left; border: 2px solid var(--ink); background: var(--fill); border-radius: 2px; padding: 12px; display: grid; gap: 4px; min-height: 64px; color: var(--fg); transition: background .12s, color .12s; }
.opt[aria-pressed="true"] { background: var(--ink); color: var(--paper); box-shadow: inset 6px 0 0 var(--red), 3px 3px 0 var(--red); }
.opt[aria-pressed="true"] small, .opt[aria-pressed="true"] .best { color: #c9c4b8; }
.opt[aria-pressed="true"] .best b { color: var(--tape); }
.opt b { font-family: var(--font-display); font-weight: 400; font-size: 19px; letter-spacing: .03em; text-transform: uppercase; line-height: 1.05; }
.opt small { color: var(--muted); font-size: 12.5px; line-height: 1.3; }
.track-list { display: grid; gap: 8px; margin-bottom: 18px; }
.track-opt { grid-template-columns: 64px 1fr auto; align-items: center; gap: 12px; }
.swatch { width: 64px; height: 42px; border-radius: 0; position: relative; overflow: hidden; border: 2px solid var(--ink); }
.swatch::after { content: ""; position: absolute; left: -10%; right: -10%; bottom: 30%; height: 4px; background: rgba(255,255,255,.8); transform: rotate(-12deg); }
.swatch::before { content: ""; position: absolute; inset: 0; background: radial-gradient(rgba(0,0,0,.22) 1px, transparent 1.4px) 0 0 / 4px 4px; z-index: 1; }
.sw-minato { background: linear-gradient(180deg, #05071a, #30235a 70%, #f2c230 70% 74%, #25262c 74%); }
.sw-akane { background: linear-gradient(180deg, #27306e, #ff8a5b 70%, #4c5a2e 70%); }
.sw-piton { background: linear-gradient(180deg, #2f7fd6, #cfe7f3 64%, #1d6f9e 64% 72%, #2f2b29 72%); }
.sw-shiohama { background: linear-gradient(180deg, #34457a, #ffb38a 66%, #f2c230 66% 70%, #34353c 70%); }
.sw-yukimi { background: linear-gradient(180deg, #6f8fb8, #e6eef5 62%, #ffffff 62% 72%, #45474d 72%); }
.sw-kaigan { background: linear-gradient(180deg, #1e2458, #e07a8a 62%, #3a3050 62% 72%, #2f2b29 72%); }
.best { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 11px; text-align: right; font-family: var(--font-wide); letter-spacing: .06em; text-transform: uppercase; }
.best b { display: block; color: var(--fg); font-family: var(--font-display); font-weight: 400; font-size: 20px; letter-spacing: .02em; }
.row-end { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }

/* ---------- atelier : page de préparateur ---------- */
#garage { justify-content: flex-end; align-items: stretch; }
#garage .card { width: min(450px, 100%); align-self: stretch; display: flex; flex-direction: column; gap: 10px; padding: 16px; }
.shop-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.shop-head h2 { margin: 4px 0 0; }
.wallet { font-family: var(--font-wide); font-size: 17px; color: var(--tape); background: var(--ink); border: 2px solid var(--ink); border-radius: 2px; padding: 7px 12px 5px; font-variant-numeric: tabular-nums; white-space: nowrap; box-shadow: 3px 3px 0 var(--red); }
.wallet-fixed { position: fixed; left: max(16px, env(safe-area-inset-left)); top: max(14px, env(safe-area-inset-top)); z-index: 21; }
.tabs { display: flex; gap: 0; overflow-x: auto; scrollbar-width: none; touch-action: pan-x; flex: none; border-bottom: 3px solid var(--ink); }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: none; min-height: 40px; padding: 0 12px; border: 0; border-radius: 0; background: transparent; color: var(--muted); font-family: var(--font-display); font-weight: 400; font-size: 16px; letter-spacing: .05em; text-transform: uppercase; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--paper); box-shadow: inset 0 -4px 0 var(--red); }
.shop-body { flex: 1; min-height: 0; overflow: auto; display: grid; gap: 12px; align-content: start; touch-action: pan-y; overscroll-behavior: contain; padding-right: 2px; }
.shop-body .sub { margin: 0; font-size: 13px; }
.shop-row { display: grid; gap: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { appearance: none; cursor: pointer; min-height: 44px; padding: 5px 10px; border-radius: 2px; border: 2px solid rgba(10,10,10,.35); background: var(--fill); display: grid; grid-template-columns: auto 1fr; column-gap: 7px; align-items: center; text-align: left; color: var(--fg); }
.chip b { font-size: 13px; font-weight: 600; grid-column: 2; }
.chip small { font-size: 11.5px; grid-column: 2; font-variant-numeric: tabular-nums; font-weight: 600; }
.chip .dot { grid-row: 1 / span 2; width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(0,0,0,.35), 0 0 0 1px rgba(10,10,10,.4); }
.chip .dot.none { background: repeating-linear-gradient(45deg, #333 0 4px, #555 4px 8px); }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--tape); box-shadow: 3px 3px 0 var(--ink); }
.chip.swatch { grid-template-columns: auto; justify-items: center; padding: 5px; min-width: 48px; min-height: 48px; row-gap: 2px; }
.chip.swatch .dot { grid-row: auto; width: 28px; height: 28px; }
.chip.swatch b { display: none; }
.chip.swatch small { grid-column: 1; font-size: 10px; } .chip.swatch small.own { display: none; }
small.own { color: var(--ok); } small.price { color: var(--red); }
.carpick { appearance: none; cursor: pointer; text-align: left; border: 2px solid var(--ink); background: var(--fill); border-radius: 2px; padding: 10px 12px; display: grid; gap: 6px; color: var(--fg); }
.carpick[aria-pressed="true"] { background: #fff; box-shadow: inset 6px 0 0 var(--red), 4px 4px 0 var(--ink); }
.carpick small { color: var(--muted); font-size: 12.5px; }
.cp-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; } .cp-head b { font-family: var(--font-display); font-weight: 400; font-size: 24px; letter-spacing: .03em; line-height: 1; } .cp-head small { font-weight: 700; }
.stats { display: grid; gap: 5px; }
.stat { display: grid; grid-template-columns: 80px 1fr; gap: 10px; align-items: center; font-family: var(--font-wide); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
/* barre segmentée façon fiche technique */
.sbar { display: flex; height: 9px; background: rgba(10,10,10,.12); overflow: hidden; position: relative; }
.sbar::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 2px), var(--paper) calc(10% - 2px) 10%); pointer-events: none; }
.sbar i { display: block; height: 100%; background: var(--ink); transition: width .25s; }
.sbar i.up { background: var(--red); }
.perf-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px dashed var(--line); }
.perf-row b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 18px; letter-spacing: .03em; text-transform: uppercase; } .perf-row small { display: block; color: var(--muted); font-size: 12px; }
.pips { display: inline-flex; gap: 3px; margin-top: 5px; } .pips i { width: 20px; height: 7px; background: rgba(10,10,10,.14); transform: skewX(-20deg); } .pips i.on { background: var(--ink); } .pips i.next { background: var(--red); }
.tech { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; padding: 10px 12px; margin-bottom: 6px; border: 2px solid var(--ink); background: #f6f4ef; box-shadow: 3px 3px 0 var(--ink); }
.tech > div small { display: block; color: var(--muted); font-family: var(--font-wide); font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; } .tech > div b { font-family: var(--font-display); font-weight: 400; font-size: 18px; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.tech .bal { grid-column: 1 / -1; } .tech .bal b { font-family: var(--font-ui); font-weight: 700; font-size: 12px; } .tech .bal .ends { display: flex; justify-content: space-between; color: var(--muted); }
.balbar { position: relative; display: block; height: 8px; margin: 6px 0 2px; background: linear-gradient(90deg, var(--blue), #cfcac0 50%, var(--red)); }
.balbar i { position: absolute; top: -5px; width: 4px; height: 18px; margin-left: -2px; background: var(--ink); transition: left .2s; }
.tune-h { margin: 14px 0 2px; font-family: var(--font-display); font-weight: 400; font-size: 20px; letter-spacing: .04em; text-transform: uppercase; color: var(--fg); border-bottom: 3px solid var(--ink); padding-bottom: 2px; display: flex; justify-content: space-between; }
.rng.tune .fx { color: var(--muted); font-size: 11.5px; font-style: italic; }
.chip.reset { margin-top: 12px; justify-self: start; }
@media (orientation: landscape) and (max-height: 560px) { .tech { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px 10px; padding: 8px 10px; } .tech > div b { font-size: 16px; } }
.maxed { font-family: var(--font-display); color: var(--ok); font-size: 18px; letter-spacing: .05em; }
.rng.tune .ends { display: flex; justify-content: space-between; color: var(--muted); }
.shop-foot { display: flex; gap: 8px; justify-content: flex-end; align-items: center; flex-wrap: wrap; flex: none; border-top: 3px solid var(--ink); padding-top: 10px; }
.shop-foot .btn { min-height: 46px; padding: 0 16px; font-size: 17px; }
.shop-foot .btn.primary { font-size: 18px; min-height: 50px; }
.shop-foot .btn:disabled { opacity: .45; cursor: not-allowed; }
.shop-msg { flex: 1 1 140px; font-size: 13px; color: var(--fg); font-weight: 600; } .shop-msg.warn { color: var(--red); }
.shop-foot .btn.compact { min-width: 46px; padding: 0 12px; justify-content: center; }

/* ---------- portefeuille : gains, toasts, carrière ---------- */
#toasts { position: fixed; left: 50%; top: calc(max(12px, env(safe-area-inset-top)) + 56px); transform: translateX(-50%); z-index: 40; display: grid; gap: 6px; justify-items: center; pointer-events: none; width: min(92vw, 520px); }
.toast { background: var(--paper); color: var(--ink); border: 2px solid var(--ink); border-left: 8px solid var(--ok); border-radius: 2px; padding: 7px 14px; font-weight: 700; font-size: 14px; box-shadow: 4px 4px 0 rgba(0,0,0,.85); animation: toast 3.2s ease-out forwards; }
.toast.chal { border-left-color: var(--tape); } .toast.buy { border-left-color: var(--blue); }
@keyframes toast { 0% { opacity: 0; transform: translateY(-12px); } 8% { opacity: 1; transform: none; } 85% { opacity: 1; } 100% { opacity: 0; transform: translateY(-6px); } }
.pay { background: #f6f4ef; border: 2px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); padding: 10px 12px; margin-bottom: 14px; display: grid; gap: 4px; }
.pay-lines div { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pay-lines div b { color: var(--fg); font-weight: 700; }
.pay-total { display: flex; justify-content: space-between; align-items: baseline; border-top: 3px solid var(--ink); padding-top: 6px; margin-top: 2px; }
.pay-total span { font-family: var(--font-wide); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--fg); }
.pay-total b { font-family: var(--font-display); font-weight: 400; font-size: 32px; color: var(--ok); font-variant-numeric: tabular-nums; }
#payChal div { font-size: 13px; color: var(--red); font-weight: 700; }
.chal-list, .log-list { list-style: none; margin: 6px 0 14px; padding: 0; display: grid; gap: 6px; }
.chal-list li { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; font-size: 14px; background: var(--fill); border: 2px solid rgba(10,10,10,.25); padding: 8px 10px; }
.chal-list li .ck { width: 20px; height: 20px; border: 2px solid var(--ink); display: grid; place-items: center; font-size: 12px; }
.chal-list li.done { color: var(--muted); } .chal-list li.done .ck { background: var(--ink); color: var(--tape); }
.chal-list li b { color: var(--red); font-variant-numeric: tabular-nums; font-size: 13px; } .chal-list li.done b { color: var(--ok); }
.log-list li { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--muted); border-bottom: 1px dashed var(--line); padding: 4px 0; }
