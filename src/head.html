<style>
/* DA « Télémétrie de nuit » : surfaces sombres profondes, filets fins, une seule couleur d'accent (le jaune de l'emblème),
   une seule famille de caractères. La scène 3D reste le sujet ; l'interface s'efface et hiérarchise. */
:root {
  color-scheme: dark;
  --bg: #07080a;
  --s1: #0e1013;           /* surfaces, de la plus profonde à la plus haute */
  --s2: #14171b;
  --s3: #1b1f24;
  --s4: #242930;
  --hair: rgba(255, 255, 255, 0.08);
  --hair-2: rgba(255, 255, 255, 0.15);
  --fg: #f2f2ef;
  --fg-2: #a4a8af;
  --fg-3: #6c717a;
  --accent: #f7d154;       /* jaune de l'emblème : action principale, sélection, combo, argent */
  --accent-ink: #15120a;
  --accent-soft: rgba(247, 209, 84, 0.12);
  --accent-2: #7b8cff;     /* complémentaire du jaune : infos secondaires, rapport, multiplicateur, tandem, rubriques */
  --accent-2-soft: rgba(123, 140, 255, 0.14);
  --red: #ff4d4f;
  --clip: #ffb020;         /* zone extérieure */
  --apex: #38d6ff;         /* corde intérieure */
  --ok: #3ddc84;
  /* alias historiques, utilisés par les composants */
  --paper: var(--fg); --muted: var(--fg-2); --line: var(--hair); --tape: var(--accent); --tail: var(--red);
  --font: "Archivo", "Inter", "Segoe UI", system-ui, sans-serif;
  --serif: "Instrument Serif", "Times New Roman", Georgia, serif; /* voix éditoriale : titres de une, chapôs, chiffres d'exception */
  --font-jp: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  --r: 14px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --logo: url("%LOGO%"); /* emblème du club, injecté par build.mjs */
  --btn: 76px;
}
[hidden] { display: none !important; }
html, body { height: 100%; touch-action: none; -webkit-touch-callout: none; overscroll-behavior: none; }
button, input, .opt { touch-action: manipulation; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-stretch: 100%; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; -webkit-font-smoothing: antialiased; }
canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.jp { font-family: var(--font-jp); font-weight: 700; }

/* ---------- écrans ---------- */
.screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); z-index: 20; }
.screen.dim { background: radial-gradient(130% 100% at 50% 30%, rgba(7,8,10,.55), rgba(7,8,10,.9)); }
.screen:not([hidden]) .card { animation: rise .32s var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.99); } to { opacity: 1; transform: none; } }
.select-grid { display: grid; gap: 4px; }
@media (orientation: landscape) and (max-height: 560px) { #select .sub { display: none; } #select h2 { font-size: 24px; margin-bottom: 12px; } .select-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 24px; align-items: start; } #select .card { width: min(900px, 100%); } .card { padding: 16px 20px; } .card .sub { margin-bottom: 12px; } .seg.modes { grid-template-columns: 1fr; } .seg.modes .opt { min-height: 0; padding: 10px 12px; } .track-opt { padding: 8px 10px; } .setting { padding: 9px 0; } }
.card { background: linear-gradient(180deg, rgba(22,25,30,.97), rgba(12,14,17,.97)); border: 1px solid var(--hair); border-radius: 20px; box-shadow: 0 1px 0 rgba(255,255,255,.05) inset, 0 30px 80px rgba(0,0,0,.55); padding: 24px; width: min(560px, 100%); max-height: 100%; overflow: auto; touch-action: pan-y pinch-zoom; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--s4) transparent; }
.card h2 { font-stretch: 116%; font-weight: 800; font-size: clamp(24px, 4vw, 32px); line-height: 1.05; letter-spacing: -.015em; margin: 8px 0 6px; text-wrap: balance; }
.card .sub { color: var(--fg-2); margin: 0 0 20px; font-size: 14.5px; line-height: 1.5; }
.eyebrow { display: inline-flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); }
.eyebrow .jp { color: var(--accent-2); font-size: 11px; letter-spacing: .1em; padding-left: 10px; border-left: 1px solid var(--hair-2); }

/* ---------- menu titre : la 3D en héros, l'interface en marge ---------- */
#menu { justify-content: space-between; align-items: stretch; flex-direction: column; background: linear-gradient(90deg, rgba(7,8,10,.86) 0%, rgba(7,8,10,.5) 30%, rgba(7,8,10,0) 55%), linear-gradient(0deg, rgba(7,8,10,.7) 0%, rgba(7,8,10,0) 40%); }
.title-block { display: grid; gap: 12px; justify-items: start; }
.brand { display: flex; align-items: center; gap: 14px; }
.emblem { width: clamp(64px, 10vw, 92px); aspect-ratio: 1; flex: none; background: var(--logo) center / contain no-repeat; filter: drop-shadow(0 8px 24px rgba(0,0,0,.6)); }
.logo { margin: 0; font-stretch: 125%; font-weight: 900; font-size: clamp(30px, 5.4vw, 52px); line-height: .95; letter-spacing: -.02em; color: var(--fg); text-shadow: 0 2px 24px rgba(0,0,0,.5); }
.logo span { display: block; font-stretch: 100%; font-weight: 600; font-size: clamp(11px, 1.4vw, 13px); letter-spacing: .42em; color: var(--accent); margin-top: 8px; }
.logo-jp { position: fixed; right: max(18px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom)); writing-mode: vertical-rl; font-family: var(--font-jp); font-weight: 700; font-size: 13px; letter-spacing: .5em; color: rgba(242,242,239,.42); pointer-events: none; }
.logo-jp b { color: var(--accent); font-weight: 700; }
/* sommaire : liste typographique, repère d'accent sur l'entrée active */
.menu-btns { display: grid; gap: 2px; justify-items: start; width: min(360px, 100%); }
#menu .menu-btns .btn { width: 100%; justify-content: flex-start; background: none; border: 0; box-shadow: none; min-height: 46px; padding: 0 0 0 18px; border-radius: 0; font-stretch: 115%; font-size: 19px; font-weight: 700; letter-spacing: -.005em; color: rgba(242,242,239,.72); position: relative; transition: color .2s, transform .25s var(--ease); }
#menu .menu-btns .btn::before { content: ""; position: absolute; left: 0; top: 50%; width: 3px; height: 0; background: var(--accent); border-radius: 2px; transform: translateY(-50%); transition: height .25s var(--ease); }
#menu .menu-btns .btn:hover, #menu .menu-btns .btn:focus-visible { color: var(--fg); transform: translateX(4px); outline: none; }
#menu .menu-btns .btn:hover::before, #menu .menu-btns .btn:focus-visible::before { height: 22px; }
#menu .menu-btns .btn.primary { color: var(--fg); font-size: clamp(30px, 4.4vw, 40px); font-weight: 900; font-stretch: 122%; min-height: 64px; margin-bottom: 6px; }
#menu .menu-btns .btn.primary::before { height: 34px; }
#menu .menu-btns .btn.primary::after { content: "→"; margin-left: 14px; font-stretch: 100%; font-weight: 400; color: var(--accent); transition: transform .25s var(--ease); }
#menu .menu-btns .btn.primary:hover::after { transform: translateX(6px); }
.menu-btns .no { font-style: normal; font-size: 11px; font-weight: 600; font-stretch: 100%; letter-spacing: .1em; color: var(--accent-2); width: 26px; font-variant-numeric: tabular-nums; }
#menu .menu-btns .btn.primary .no { display: none; }
#menu .menu-btns .btn { animation: slideIn .5s var(--ease) both; }
#menu .menu-btns .btn:nth-child(2) { animation-delay: .05s; } #menu .menu-btns .btn:nth-child(3) { animation-delay: .1s; } #menu .menu-btns .btn:nth-child(4) { animation-delay: .15s; } #menu .menu-btns .btn:nth-child(5) { animation-delay: .2s; }
@keyframes slideIn { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
@media (orientation: portrait) { #menu { background: linear-gradient(0deg, rgba(7,8,10,.95) 0%, rgba(7,8,10,.6) 45%, rgba(7,8,10,0) 70%), linear-gradient(180deg, rgba(7,8,10,.6), rgba(7,8,10,0) 30%); } .brand { padding-top: 44px; } }

.btn { appearance: none; border: 1px solid var(--hair-2); cursor: pointer; min-height: 50px; padding: 0 20px; border-radius: 12px; font-stretch: 112%; font-weight: 700; font-size: 15px; letter-spacing: .02em; background: var(--s3); color: var(--fg); transition: background .15s, border-color .15s, transform .12s var(--ease); display: inline-flex; align-items: center; justify-content: center; gap: 10px; }
.btn > * { display: inline-flex; align-items: baseline; gap: 8px; }
.btn:hover { background: var(--s4); border-color: rgba(255,255,255,.22); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 800; font-size: 16px; min-height: 54px; padding: 0 28px; box-shadow: 0 8px 24px rgba(247,209,84,.18); }
.btn.primary:hover { background: #ffdc6a; }
.btn.ghost { background: transparent; color: var(--fg-2); }
.btn.ghost:hover { color: var(--fg); background: rgba(255,255,255,.04); }
.hint { color: var(--fg-2); font-size: 13px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; line-height: 1.4; }
#menu .hint { color: rgba(242,242,239,.6); }
.kbd { border: 1px solid var(--hair-2); border-bottom-width: 2px; border-radius: 6px; padding: 0 6px; font-size: 11.5px; font-weight: 600; color: var(--fg); background: rgba(255,255,255,.04); }
.portrait-tip { display: none; }
@media (orientation: portrait) and (max-width: 700px) { .portrait-tip { display: flex; } .logo-jp { display: none; } }

/* ---------- choix ---------- */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
.opt { appearance: none; cursor: pointer; text-align: left; border: 1px solid var(--hair); background: var(--s2); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 4px; min-height: 64px; color: var(--fg); transition: border-color .15s, background .15s; position: relative; }
.opt:hover { border-color: var(--hair-2); background: var(--s3); }
.opt[aria-pressed="true"] { border-color: var(--accent); background: linear-gradient(180deg, var(--accent-soft), rgba(247,209,84,.04)); box-shadow: 0 0 0 1px var(--accent) inset; }
.opt b { font-stretch: 112%; font-weight: 750; font-size: 15px; letter-spacing: -.005em; }
.opt small { color: var(--fg-2); font-size: 12.5px; line-height: 1.35; }
.track-list { display: grid; gap: 8px; margin-bottom: 18px; }
.track-opt { grid-template-columns: 64px 1fr auto; align-items: center; gap: 14px; }
.swatch { width: 64px; height: 44px; border-radius: 9px; position: relative; overflow: hidden; box-shadow: 0 0 0 1px rgba(255,255,255,.1) inset; }
.swatch::after { content: ""; position: absolute; left: -10%; right: -10%; bottom: 30%; height: 3px; background: rgba(255,255,255,.7); transform: rotate(-12deg); }
.sw-minato { background: linear-gradient(180deg, #05071a, #30235a 70%, #f2c230 70% 74%, #25262c 74%); }
.sw-akane { background: linear-gradient(180deg, #27306e, #ff8a5b 70%, #4c5a2e 70%); }
.sw-piton { background: linear-gradient(180deg, #2f7fd6, #cfe7f3 64%, #1d6f9e 64% 72%, #2f2b29 72%); }
.sw-shiohama { background: linear-gradient(180deg, #34457a, #ffb38a 66%, #f2c230 66% 70%, #34353c 70%); }
.sw-yukimi { background: linear-gradient(180deg, #6f8fb8, #e6eef5 62%, #ffffff 62% 72%, #45474d 72%); }
.sw-kaigan { background: linear-gradient(180deg, #1e2458, #e07a8a 62%, #3a3050 62% 72%, #2f2b29 72%); }
.best { font-variant-numeric: tabular-nums; color: var(--fg-3); font-size: 10.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; text-align: right; }
.best b { display: block; color: var(--fg); font-size: 16px; font-weight: 700; letter-spacing: 0; text-transform: none; }
.opt[aria-pressed="true"] .best b { color: var(--accent); }
.row-end { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }

/* ---------- atelier ---------- */
#garage { justify-content: flex-end; align-items: stretch; }
#garage .card { width: min(450px, 100%); align-self: stretch; display: flex; flex-direction: column; gap: 12px; padding: 18px; }
.shop-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.shop-head h2 { margin: 6px 0 0; }
.wallet { font-size: 15px; font-weight: 700; font-stretch: 110%; color: var(--accent); background: rgba(7,8,10,.72); border: 1px solid rgba(247,209,84,.28); border-radius: 999px; padding: 7px 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.wallet-fixed { position: fixed; right: max(16px, env(safe-area-inset-right)); top: max(14px, env(safe-area-inset-top)); z-index: 21; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; touch-action: pan-x; flex: none; border-bottom: 1px solid var(--hair); }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: none; min-height: 42px; padding: 0 12px; border: 0; background: none; color: var(--fg-3); font-weight: 700; font-stretch: 108%; font-size: 13.5px; cursor: pointer; position: relative; transition: color .15s; }
.tabs button::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--accent); transform: scaleX(0); transition: transform .25s var(--ease); }
.tabs button:hover { color: var(--fg-2); }
.tabs button[aria-selected="true"] { color: var(--fg); }
.tabs button[aria-selected="true"]::after { transform: none; }
.shop-body { flex: 1; min-height: 0; overflow: auto; display: grid; gap: 14px; align-content: start; touch-action: pan-y pinch-zoom; overscroll-behavior: contain; padding-right: 2px; scrollbar-width: thin; scrollbar-color: var(--s4) transparent; }
.shop-body .sub { margin: 0; font-size: 13px; }
.shop-row { display: grid; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { appearance: none; cursor: pointer; min-height: 44px; padding: 6px 12px; border-radius: 11px; border: 1px solid var(--hair); background: var(--s2); display: grid; grid-template-columns: auto 1fr; column-gap: 8px; align-items: center; text-align: left; color: var(--fg); transition: border-color .15s, background .15s; }
.chip:hover { border-color: rgba(123,140,255,.45); }
.chip b { font-size: 13px; font-weight: 650; grid-column: 2; }
.chip small { font-size: 11.5px; grid-column: 2; font-variant-numeric: tabular-nums; color: var(--fg-2); }
.chip .dot { grid-row: 1 / span 2; width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.18); }
.chip .dot.none { background: repeating-linear-gradient(45deg, #2a2d33 0 4px, #3a3e45 4px 8px); }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent) inset; }
.chip.swatch { grid-template-columns: auto; justify-items: center; padding: 5px; min-width: 48px; min-height: 48px; border-radius: 12px; row-gap: 3px; }
.chip.swatch .dot { grid-row: auto; width: 28px; height: 28px; }
.chip.swatch b { display: none; }
.chip.swatch small { grid-column: 1; font-size: 10px; } .chip.swatch small.own { display: none; }
small.own { color: var(--ok) !important; } small.price { color: var(--accent) !important; }
.carpick { appearance: none; cursor: pointer; text-align: left; border: 1px solid var(--hair); background: var(--s2); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 8px; color: var(--fg); transition: border-color .15s; }
.carpick[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; background: linear-gradient(180deg, var(--accent-soft), transparent); }
.carpick small { color: var(--fg-2); font-size: 12.5px; }
.cp-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; } .cp-head b { font-stretch: 122%; font-weight: 900; font-size: 19px; letter-spacing: -.01em; } .cp-head small { font-weight: 700; }
.stats { display: grid; gap: 6px; }
.stat { display: grid; grid-template-columns: 76px 1fr; gap: 10px; align-items: center; font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--fg-3); }
.sbar { display: flex; height: 4px; border-radius: 2px; background: rgba(255,255,255,.08); overflow: hidden; }
.sbar i { display: block; height: 100%; background: var(--fg); transition: width .3s var(--ease); }
.sbar i.up { background: var(--accent); }
.perf-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--hair); }
.perf-row b { display: block; font-stretch: 112%; font-weight: 750; font-size: 15px; } .perf-row small { display: block; color: var(--fg-2); font-size: 12px; margin-top: 1px; }
.pips { display: inline-flex; gap: 4px; margin-top: 7px; } .pips i { width: 22px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.12); } .pips i.on { background: var(--fg); } .pips i.next { background: var(--accent); }
.tech { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; padding: 14px; margin-bottom: 4px; border: 1px solid var(--hair); border-radius: var(--r); background: var(--s1); }
.tech > div small { display: block; color: var(--fg-3); font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 2px; } .tech > div b { font-stretch: 110%; font-weight: 750; font-size: 15px; font-variant-numeric: tabular-nums; }
.tech .bal { grid-column: 1 / -1; } .tech .bal b { font-size: 12px; color: var(--fg); } .tech .bal .ends { display: flex; justify-content: space-between; color: var(--fg-3); font-size: 10.5px; }
.balbar { position: relative; display: block; height: 4px; margin: 10px 0 6px; border-radius: 2px; background: linear-gradient(90deg, var(--accent-2), rgba(255,255,255,.14) 50%, var(--red)); }
.balbar i { position: absolute; top: -5px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--fg); box-shadow: 0 0 0 3px var(--s1); transition: left .25s var(--ease); }
.tune-h { margin: 16px 0 0; font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--accent-2); }
.rng.tune .fx { color: var(--fg-3); font-size: 11.5px; }
.chip.reset { margin-top: 8px; justify-self: start; }
@media (orientation: landscape) and (max-height: 560px) { .tech { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 12px; padding: 10px 12px; } .tech > div b { font-size: 14px; } }
.maxed { font-weight: 800; font-stretch: 115%; color: var(--ok); font-size: 13px; letter-spacing: .12em; }
.rng.tune .ends { display: flex; justify-content: space-between; color: var(--fg-3); }
.shop-foot { display: flex; gap: 8px; justify-content: flex-end; align-items: center; flex-wrap: wrap; flex: none; padding-top: 12px; border-top: 1px solid var(--hair); }
.shop-foot .btn { min-height: 46px; padding: 0 18px; }
.shop-foot .btn.primary { min-height: 48px; }
.shop-foot .btn:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
.shop-msg { flex: 1 1 140px; font-size: 13px; color: var(--fg); } .shop-msg.warn { color: var(--red); }
.shop-foot .btn.compact { min-width: 46px; padding: 0 12px; }

/* ---------- portefeuille : gains, toasts, carrière ---------- */
#toasts { position: fixed; left: 50%; top: calc(max(12px, env(safe-area-inset-top)) + 58px); transform: translateX(-50%); z-index: 40; display: grid; gap: 6px; justify-items: center; pointer-events: none; width: min(92vw, 520px); }
.toast { display: flex; align-items: center; gap: 10px; background: rgba(20,23,27,.96); border: 1px solid var(--hair-2); border-radius: 999px; padding: 8px 16px 8px 12px; font-weight: 600; font-size: 13.5px; box-shadow: 0 12px 32px rgba(0,0,0,.45); animation: toast 3.2s var(--ease) forwards; }
.toast::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 10px var(--ok); flex: none; }
.toast.chal::before { background: var(--accent); box-shadow: 0 0 10px var(--accent); } .toast.buy::before { background: var(--accent-2); box-shadow: 0 0 10px var(--accent-2); }
@keyframes toast { 0% { opacity: 0; transform: translateY(-10px) scale(.97); } 8% { opacity: 1; transform: none; } 85% { opacity: 1; } 100% { opacity: 0; transform: translateY(-6px); } }
.pay { background: var(--s1); border: 1px solid var(--hair); border-radius: var(--r); padding: 14px; margin-bottom: 14px; display: grid; gap: 5px; }
.pay-lines div { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--fg-2); font-variant-numeric: tabular-nums; }
.pay-lines div b { color: var(--fg); font-weight: 650; }
.pay-total { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--hair); padding-top: 9px; margin-top: 4px; }
.pay-total span { font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--fg-3); font-weight: 700; }
.pay-total b { font-stretch: 120%; font-weight: 900; font-size: 30px; letter-spacing: -.02em; color: var(--accent); font-variant-numeric: tabular-nums; }
#payChal div { font-size: 13px; color: var(--accent); font-weight: 600; }
.chal-list, .log-list { list-style: none; margin: 8px 0 18px; padding: 0; display: grid; gap: 6px; }
.chal-list li { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; font-size: 14px; background: var(--s2); border: 1px solid var(--hair); border-radius: 12px; padding: 10px 12px; }
.chal-list li .ck { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--hair-2); display: grid; place-items: center; font-size: 11px; }
.chal-list li.done { color: var(--fg-3); } .chal-list li.done .ck { background: var(--ok); border-color: var(--ok); color: #04210f; }
.chal-list li b { color: var(--accent); font-variant-numeric: tabular-nums; font-size: 13px; } .chal-list li.done b { color: var(--fg-3); }
.log-list li { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--fg-2); border-bottom: 1px solid var(--hair); padding: 6px 0; }
.log-list li b { font-variant-numeric: tabular-nums; color: var(--ok); } .log-list li b.neg { color: var(--red); }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper output { font-stretch: 120%; font-weight: 900; font-size: 24px; min-width: 52px; text-align: center; font-variant-numeric: tabular-nums; }
.stepper button { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--hair-2); background: var(--s3); cursor: pointer; font-size: 20px; }
.label { font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--accent-2); font-weight: 700; margin-bottom: 8px; }

/* ---------- réglages ---------- */
.setting { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--hair); }
.setting:last-of-type { border-bottom: 0; }
.setting p { margin: 3px 0 0; color: var(--fg-2); font-size: 13px; line-height: 1.4; }
.setting label { font-weight: 650; }
.toggle { appearance: none; width: 50px; height: 30px; border-radius: 99px; background: var(--s4); position: relative; cursor: pointer; border: 0; transition: background .2s; box-shadow: inset 0 0 0 1px var(--hair); }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--fg); box-shadow: 0 2px 6px rgba(0,0,0,.4); transition: transform .25s var(--ease); }
.toggle:checked { background: var(--accent); }
.toggle:checked::after { transform: translateX(20px); background: #fff; }
.mini-seg { display: inline-flex; background: var(--s1); border: 1px solid var(--hair); border-radius: 12px; padding: 3px; gap: 2px; }
.mini-seg button { border: 0; background: transparent; padding: 0 12px; min-height: 36px; border-radius: 9px; cursor: pointer; font-weight: 650; font-size: 13.5px; color: var(--fg-2); transition: background .15s, color .15s; }
.mini-seg button[aria-pressed="true"] { background: var(--s4); color: var(--fg); box-shadow: 0 1px 0 rgba(255,255,255,.08) inset, 0 2px 8px rgba(0,0,0,.3); }

/* ---------- aide ---------- */
.help-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 18px; }
.help-grid div { background: var(--s2); border: 1px solid var(--hair); border-radius: var(--r); padding: 14px; font-size: 13.5px; line-height: 1.5; color: var(--fg-2); }
.help-grid b { display: block; color: var(--fg); font-stretch: 115%; font-weight: 800; font-size: 15px; margin-bottom: 4px; }
.k-clip { color: var(--clip); font-weight: 650; } .k-apex { color: var(--apex); font-weight: 650; }
@media (max-width: 460px) { .help-grid { grid-template-columns: 1fr; } }

/* ---------- HUD : télémétrie, fin et lisible ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; font-variant-numeric: tabular-nums; }
.hud-top { position: absolute; top: max(12px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left)); right: max(14px, env(safe-area-inset-right)); display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 10px; }
.mm-wrap { display: flex; gap: 12px; align-items: flex-start; }
#minimap { width: 100px; height: 100px; border-radius: 16px; background: rgba(7,8,10,.5); box-shadow: 0 0 0 1px var(--hair-2) inset; }
.lapinfo { display: grid; gap: 2px; font-size: 10px; font-weight: 700; letter-spacing: .16em; color: rgba(242,242,239,.62); text-shadow: 0 1px 8px rgba(0,0,0,.7); padding-top: 2px; }
.lapinfo > span:first-child { color: var(--accent); }
.lapinfo b { color: var(--fg); font-stretch: 112%; font-weight: 750; font-size: 22px; letter-spacing: -.01em; }
.total { text-align: center; text-shadow: 0 2px 16px rgba(0,0,0,.6); }
.total .num { font-stretch: 120%; font-weight: 850; font-size: clamp(28px, 4.6vw, 40px); line-height: 1; letter-spacing: -.02em; }
.total .lbl { font-size: 9.5px; font-weight: 700; letter-spacing: .24em; color: rgba(242,242,239,.55); margin: 2px 0; }
.top-right { justify-self: end; display: flex; gap: 8px; pointer-events: auto; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(7,8,10,.5); box-shadow: 0 0 0 1px var(--hair-2) inset; display: grid; place-items: center; cursor: pointer; padding: 0; }
.icon-btn svg { width: 20px; height: 20px; fill: var(--fg); }

.combo { position: absolute; left: 50%; top: calc(max(10px, env(safe-area-inset-top)) + 92px); transform: translateX(-50%); text-align: center; transition: opacity .25s, transform .25s var(--ease); }
.combo .pts { font-stretch: 125%; font-weight: 900; font-size: clamp(38px, 6.4vw, 60px); color: var(--accent); line-height: 1; letter-spacing: -.03em; text-shadow: 0 4px 30px rgba(0,0,0,.55); }
.combo .mult { display: inline-block; font-stretch: 115%; font-weight: 850; font-size: 15px; background: var(--accent-2); color: var(--bg); box-shadow: 0 6px 20px rgba(123,140,255,.35); padding: 3px 11px; border-radius: 999px; margin-top: 8px; }
.combo .tag { font-size: 10px; font-weight: 700; letter-spacing: .32em; color: rgba(242,242,239,.7); margin-bottom: 4px; text-shadow: 0 1px 8px rgba(0,0,0,.7); }
.anglebar { width: 150px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.16); margin: 10px auto 0; overflow: hidden; }
.anglebar i { display: block; height: 100%; width: 100%; transform: scaleX(0); transform-origin: left center; will-change: transform; background: linear-gradient(90deg, var(--accent), var(--red)); }
.combo.idle { opacity: 0; transform: translateX(-50%) translateY(-6px); }
.combo.warn .pts { color: #fff0bf; }

#popups { position: absolute; left: max(14px, env(safe-area-inset-left)); top: calc(max(10px, env(safe-area-inset-top)) + 126px); display: grid; justify-items: start; gap: 6px; max-width: 46%; }
.pop { display: inline-flex; align-items: center; gap: 8px; transform-origin: left center; font-stretch: 112%; font-weight: 800; font-size: clamp(12px, 2.3vw, 15px); letter-spacing: .08em; padding: 6px 13px 6px 10px; border-radius: 999px; background: rgba(7,8,10,.66); box-shadow: 0 0 0 1px var(--hair-2) inset; animation: pop 1.6s var(--ease) forwards; text-transform: uppercase; }
.pop::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 10px currentColor; }
.pop.clip { color: var(--clip); } .pop.apex { color: var(--apex); }
.pop.bank { color: var(--accent); font-stretch: 125%; font-weight: 900; font-size: clamp(22px, 4.2vw, 32px); letter-spacing: -.02em; background: none; box-shadow: none; padding: 0; text-shadow: 0 3px 20px rgba(0,0,0,.6); }
.pop.bank::before { display: none; }
.pop.lost { color: var(--red); } .pop.tandem { color: var(--accent-2); }
@keyframes pop { 0% { opacity: 0; transform: translateX(-16px); } 12% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-10px); } }

.speedo { position: absolute; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); text-align: center; text-shadow: 0 2px 18px rgba(0,0,0,.6); }
.speedo .kmh { font-stretch: 122%; font-weight: 850; font-size: clamp(36px, 6vw, 54px); line-height: 1; letter-spacing: -.03em; }
.speedo .unit { font-size: 9.5px; font-weight: 700; letter-spacing: .3em; color: rgba(242,242,239,.6); }
.rpm { width: 150px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.16); margin: 8px auto 0; overflow: hidden; }
.rpm i { display: block; height: 100%; width: 100%; transform: scaleX(0); transform-origin: left center; will-change: transform; background: var(--fg); }
.rpm.red i { background: var(--red); }
.gear { position: absolute; right: -46px; bottom: 8px; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-stretch: 115%; font-weight: 850; font-size: 16px; color: var(--accent-2); background: rgba(7,8,10,.55); box-shadow: 0 0 0 1px rgba(123,140,255,.55) inset; text-shadow: none; }
.tandem-meter { display: none; margin-top: 4px; gap: 6px; align-items: center; font-size: 10px; letter-spacing: .16em; color: var(--accent-2); }
.tandem-meter .tm { width: 70px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.16); overflow: hidden; }
.tandem-meter .tm i { display: block; height: 100%; width: 100%; transform: scaleX(0); transform-origin: left center; background: var(--accent-2); }
.banner { position: absolute; left: 50%; top: 32%; transform: translateX(-50%); font-stretch: 120%; font-weight: 900; font-size: clamp(20px, 4vw, 32px); letter-spacing: .04em; background: var(--red); color: #fff; padding: 10px 26px; border-radius: 999px; box-shadow: 0 12px 40px rgba(255,77,79,.35); display: none; }
#count { position: fixed; inset: 0; display: grid; place-items: center; z-index: 15; pointer-events: none; font-stretch: 125%; font-weight: 900; font-size: clamp(110px, 24vw, 220px); letter-spacing: -.04em; color: var(--fg); text-shadow: 0 10px 60px rgba(0,0,0,.6); }
#count span { animation: cnt .9s var(--ease) forwards; }
@keyframes cnt { 0% { transform: scale(1.35); opacity: 0; } 22% { transform: scale(1); opacity: 1; } 78% { opacity: 1; } 100% { opacity: 0; transform: scale(.94); } }

/* ---------- commandes tactiles ---------- */
#touch { position: fixed; inset: 0; z-index: 12; pointer-events: none; display: none; }
#touch.on { display: block; }
#touch { --op: 1; }
/* bouton : position/taille posées en px par game.js. ::after élargit la zone sensible de 8 px pour ne jamais perdre le doigt entre deux boutons. */
.tbtn { position: absolute; left: 0; top: 0; box-sizing: border-box; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.22); background: rgba(7,8,10,.42); display: grid; place-items: center; transition: background .08s, border-color .08s, transform .08s; pointer-events: auto; touch-action: none; opacity: var(--op); -webkit-touch-callout: none; }
.tbtn::after { content: ""; position: absolute; inset: -8px; border-radius: inherit; }
.tbtn.hb { border-color: rgba(255,77,79,.55); }
#touch.editing { z-index: 25; }
#touch.editing .tbtn { cursor: grab; outline: 1.5px dashed rgba(247,209,84,.7); outline-offset: 4px; }
#touch.editing .tbtn.sel { outline: 2px solid var(--accent); background: rgba(247,209,84,.22); }
#touch.editing .tbtn.drag { cursor: grabbing; transform: scale(1.04); }
.screen.passthru { pointer-events: none; background: none; align-items: flex-start; justify-content: center; }
.screen.passthru .card { pointer-events: auto; width: min(640px, 100%); padding: 14px 18px; }
.screen.passthru .sub { margin: 0 0 8px; font-size: 13.5px; }
.lay-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 4px; }
.lay-head h2 { font-size: 20px; margin: 4px 0 0; }
.lay-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-bottom: 10px; }
.rng { display: grid; gap: 4px; font-size: 13px; color: var(--fg-2); }
.rng > span:first-child { color: var(--fg); font-weight: 600; }
.rng span { display: flex; justify-content: space-between; gap: 6px; }
.rng output { color: var(--accent-2); font-weight: 700; font-variant-numeric: tabular-nums; }
.rng input[type=range] { width: 100%; height: 32px; accent-color: var(--accent); margin: 0; touch-action: pan-x; }
.rng input:disabled { opacity: .35; }
@media (max-width: 4000px) { .screen.passthru .card .row-end .btn, .lay-head .btn { min-height: 44px; padding: 0 16px; } }
@media (max-width: 620px) { .lay-grid { grid-template-columns: 1fr; gap: 4px; } .lay-head .btn { min-height: 44px; } .screen.passthru .card .row-end .btn { min-height: 44px; padding: 0 14px; } }
.tt { pointer-events: none; font-stretch: 112%; font-weight: 800; font-size: 12px; letter-spacing: .1em; text-align: center; line-height: 1.1; color: var(--fg); }
.tbtn svg { width: 44%; height: 44%; fill: var(--fg); pointer-events: none; }
.tbtn.on { background: rgba(247,209,84,.4); transform: scale(.94); border-color: var(--accent); }
.tbtn.hb.on { background: rgba(255,77,79,.5); border-color: var(--red); }

@media (max-height: 420px) { :root { --btn: 64px; } .combo { top: calc(max(10px, env(safe-area-inset-top)) + 84px); } .combo .pts { font-size: 44px; } }

/* ---------- résultats ---------- */
.grade { width: 108px; height: 108px; border-radius: 50%; display: grid; place-items: center; font-stretch: 125%; font-weight: 900; font-size: 60px; letter-spacing: -.04em; color: var(--accent); background: radial-gradient(circle at 50% 35%, rgba(247,209,84,.16), rgba(247,209,84,.02) 70%); box-shadow: 0 0 0 1px rgba(247,209,84,.5) inset, 0 0 0 7px rgba(247,209,84,.06), 0 12px 40px rgba(247,209,84,.12); }
.res-head { display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center; margin: 14px 0 18px; }
.res-head h2 { margin: 0 0 4px; font-size: 13px; font-stretch: 100%; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--fg-2); }
.res-head h2 .jp { color: var(--fg-3); margin-left: 6px; }
.res-total { font-stretch: 122%; font-weight: 900; font-size: clamp(36px, 6vw, 50px); line-height: 1; letter-spacing: -.03em; }
.res-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; margin-bottom: 18px; }
.res-grid div { background: var(--s2); border: 1px solid var(--hair); border-radius: 12px; padding: 10px 12px; font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--fg-3); }
.res-grid b { display: block; color: var(--fg); font-stretch: 115%; font-weight: 800; font-size: 20px; letter-spacing: -.01em; text-transform: none; margin-top: 2px; font-variant-numeric: tabular-nums; }
.record { display: inline-flex; align-items: center; gap: 6px; background: var(--accent-soft); color: var(--accent); font-weight: 800; padding: 4px 10px; border-radius: 999px; font-size: 11px; letter-spacing: .14em; margin-top: 10px; box-shadow: 0 0 0 1px rgba(247,209,84,.35) inset; }
.ai-note { font-size: 11px; color: var(--fg-3); margin-top: 12px; }

#loading { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: radial-gradient(60% 50% at 50% 45%, #14171b, var(--bg)); text-align: center; }
#loading .emblem { width: min(30vmin, 132px); margin: 0 auto; animation: breathe 1.8s var(--ease) infinite alternate; }
#loading p { font-size: 10.5px; font-weight: 700; letter-spacing: .3em; text-transform: uppercase; color: var(--fg-3); margin: 22px 0 0; }
#loading p::after { content: ""; display: block; width: 120px; height: 2px; margin: 12px auto 0; border-radius: 2px; background: linear-gradient(90deg, transparent, var(--accent-2), var(--accent), transparent) 0 0 / 50% 100% no-repeat, rgba(255,255,255,.08); animation: load 1.2s linear infinite; }
@keyframes breathe { from { opacity: .75; transform: scale(.97); } to { opacity: 1; transform: none; } }
@keyframes load { from { background-position: -60px 0, 0 0; } to { background-position: 120px 0, 0 0; } }
@media (orientation: portrait) {
  #garage { align-items: flex-end; }
  #garage .card { align-self: auto; height: 60%; max-height: 60%; width: 100%; }
}
@media (orientation: landscape) and (max-height: 560px) {
  #results .res-card { width: min(900px, 100%); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; padding: 16px 20px; }
  #results .grade { width: 88px; height: 88px; font-size: 48px; } #results .res-grid { margin-bottom: 0; } #results .res-side .row-end .btn { min-height: 46px; padding: 0 16px; }
  #menu .menu-btns .btn { min-height: 38px; font-size: 16px; } #menu .menu-btns .btn.primary { min-height: 54px; font-size: 32px; }
}
@media (orientation: landscape) and (max-height: 560px) { #garage .card { padding: 14px 16px; gap: 9px; } #garage .card h2 { font-size: 22px; } .shop-head .eyebrow { display: none; } }
@media (max-width: 560px) {
  :root { --btn: 66px; }
  #minimap { width: 72px; height: 72px; border-radius: 12px; }
  .lapinfo b { font-size: 18px; }
  .hud-top { grid-template-columns: auto 1fr auto; }
  .total .num { font-size: 28px; }
  .icon-btn { width: 40px; height: 40px; }
  .top-right { flex-direction: column; }
  .speedo { bottom: calc(max(14px, env(safe-area-inset-bottom)) + var(--btn) * 2.2 + 18px); }
  .combo { top: calc(max(10px, env(safe-area-inset-top)) + 120px); }
  .res-side .row-end .btn { flex: 1 1 40%; }
}
/* ---------- couche éditoriale « journal de la glisse » ----------
   Sur la base sombre : manchette de quotidien, filets doubles, chapôs en serif italique,
   bandeau « dernière minute », et la une imprimée sur papier journal pour les résultats. */
.dek { font-family: var(--serif); font-style: italic; font-weight: 400; font-stretch: 100%; letter-spacing: 0; text-transform: none; }
.card h2::after { content: ""; display: block; height: 3px; margin-top: 10px; border-top: 1px solid var(--hair-2); border-bottom: 1px solid var(--hair-2); opacity: .9; }
.shop-head h2::after { display: none; }
.eyebrow { font-family: var(--font); }
/* manchette */
.masthead { display: grid; gap: 10px; width: min(560px, 100%); }
.mast-rule { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 5px 0; border-top: 1px solid rgba(242,242,239,.35); border-bottom: 1px solid rgba(242,242,239,.35); font-size: 10px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: rgba(242,242,239,.7); }
.mast-rule .jp { letter-spacing: .3em; color: var(--accent-2); }
.mast-rule span:nth-child(2) { font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 14px; letter-spacing: 0; text-transform: none; color: var(--fg); }
.masthead .brand { padding-top: 0; }
.logo em { display: block; font-family: var(--serif); font-style: italic; font-weight: 400; font-stretch: 100%; font-size: clamp(14px, 1.9vw, 18px); letter-spacing: 0; color: rgba(242,242,239,.75); margin-top: 6px; text-transform: none; }
/* sommaire : rubrique + chapô */
#menu .menu-btns .btn .dek { font-size: 15px; color: rgba(242,242,239,.5); margin-left: 12px; transition: color .2s; }
#menu .menu-btns .btn:hover .dek, #menu .menu-btns .btn:focus-visible .dek { color: var(--accent); }
#menu .menu-btns .btn.primary .dek { font-size: 18px; color: var(--accent); }
/* bandeau défilant */
.ticker { position: fixed; left: 0; right: 0; bottom: 0; height: 28px; display: flex; align-items: center; overflow: hidden; background: rgba(7,8,10,.82); border-top: 1px solid var(--hair-2); z-index: 1; pointer-events: none; }
.ticker::before { content: "Dernière minute"; position: relative; z-index: 1; flex: none; height: 100%; display: flex; align-items: center; padding: 0 14px 0 max(14px, env(safe-area-inset-left)); background: var(--accent); color: var(--accent-ink); font-size: 10px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
.tk { display: flex; flex: none; white-space: nowrap; animation: tick 40s linear infinite; }
.tk span { padding: 0 22px; font-size: 12.5px; color: rgba(242,242,239,.8); border-right: 1px solid var(--hair-2); }
.tk span b { font-weight: 700; color: var(--fg); }
.tk span i { font-family: var(--serif); font-size: 14px; color: var(--accent-2); }
@keyframes tick { from { transform: translateX(0); } to { transform: translateX(-50%); } }
