<title>Sideways Drift Club</title>
<meta name="theme-color" content="#0e0d14">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Dela+Gothic+One&display=swap">
<style>
/* Concept : écran de jeu plein cadre ; menus = « stickers » de club de drift posés sur la scène 3D vivante. Thème unique sombre, assumé. */
:root {
  color-scheme: dark;
  --ink: #0e0d14;          /* nuit d'asphalte */
  --panel: rgba(16, 15, 24, 0.78);
  --panel-solid: #17161f;
  --line: rgba(255, 255, 255, 0.12);
  --paper: #f3efe4;        /* texte principal */
  --muted: #a8a3b8;
  --tape: #ffd23f;         /* jaune « sticker » */
  --tail: #ff3d3d;         /* feu arrière */
  --clip: #ffb020;         /* zone extérieure */
  --apex: #38d6ff;         /* corde intérieure */
  --ok: #4be38a;
  --font-display: "Dela Gothic One", "Arial Black", "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
  --font-ui: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --btn: 76px;
}
[hidden] { display: none !important; }
html, body { height: 100%; touch-action: none; -webkit-touch-callout: none; overscroll-behavior: none; }
button, input, .opt { touch-action: manipulation; }
body { margin: 0; background: var(--ink); color: var(--paper); font-family: var(--font-ui); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--tape); outline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- écrans ---------- */
.screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); z-index: 20; }
.screen.dim { background: radial-gradient(120% 90% at 50% 40%, rgba(14,13,20,.35), rgba(14,13,20,.86)); }
.select-grid { display: grid; gap: 4px; }
@media (orientation: landscape) and (max-height: 560px) { #select .sub { display: none; } #select h2 { font-size: 22px; margin-bottom: 10px; } .select-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 22px; align-items: start; } #select .card { width: min(900px, 100%); } .card { padding: 16px 20px; } .card .sub { margin-bottom: 12px; } .seg.modes { grid-template-columns: 1fr; } .seg.modes .opt { min-height: 0; padding: 9px 12px; } .track-opt { padding: 8px 10px; } .setting { padding: 8px 0; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 22px; width: min(560px, 100%); max-height: 100%; overflow: auto; touch-action: pan-y; overscroll-behavior: contain; box-shadow: 0 24px 60px rgba(0,0,0,.45); }
.card h2 { font-family: var(--font-display); font-weight: 400; font-size: clamp(22px, 4vw, 30px); margin: 0 0 4px; letter-spacing: .02em; text-wrap: balance; }
.card .sub { color: var(--muted); margin: 0 0 18px; font-size: 15px; }
.eyebrow { font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--tape); font-weight: 700; }

/* ---------- menu titre ---------- */
#menu { justify-content: flex-start; align-items: flex-end; background: linear-gradient(20deg, rgba(14,13,20,.82) 0%, rgba(14,13,20,.45) 38%, rgba(14,13,20,0) 62%); }
.title-block { display: grid; gap: 18px; max-width: 520px; }
.logo { font-family: var(--font-display); line-height: .86; font-size: clamp(54px, 11vw, 112px); margin: 0; letter-spacing: -.01em; color: var(--paper); text-shadow: 0 4px 0 #000, 0 10px 30px rgba(0,0,0,.5); transform: skewX(-8deg); transform-origin: left bottom; }
.logo span { display: block; color: var(--tape); font-size: .36em; letter-spacing: .14em; margin-top: 8px; }
.logo-jp { position: fixed; right: max(16px, env(safe-area-inset-right)); top: max(16px, env(safe-area-inset-top)); writing-mode: vertical-rl; font-family: var(--font-display); font-size: clamp(22px, 4vw, 40px); color: rgba(255,255,255,.88); text-shadow: 0 2px 0 #000; letter-spacing: .1em; pointer-events: none; }
.logo-jp b { color: var(--tail); font-weight: 400; }
.menu-btns { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { appearance: none; border: 0; cursor: pointer; min-height: 52px; padding: 0 22px; border-radius: 10px; font-weight: 700; font-size: 17px; letter-spacing: .04em; text-transform: uppercase; background: rgba(14,13,20,.66); color: var(--paper); transform: skewX(-8deg); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition: transform .12s, background .12s; display: inline-flex; align-items: center; gap: 10px; }
.btn > * { transform: skewX(8deg); }
.btn:hover { background: rgba(40,38,54,.85); }
.btn:active { transform: skewX(-8deg) scale(.96); }
.btn.primary { background: var(--tape); color: #15130c; box-shadow: 0 6px 0 #b8901a; font-size: 20px; min-height: 60px; padding: 0 30px; }
.btn.primary:active { box-shadow: 0 2px 0 #b8901a; transform: skewX(-8deg) translateY(4px); }
.btn.ghost { background: rgba(14,13,20,.4); border: 1px solid var(--line); }
.hint { color: #cfcadb; font-size: 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; text-shadow: 0 1px 2px #000; }
.kbd { border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; font-size: 12px; color: var(--paper); }
.portrait-tip { display: none; }
@media (orientation: portrait) and (max-width: 700px) { .portrait-tip { display: flex; } }

/* ---------- choix ---------- */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
.opt { appearance: none; cursor: pointer; text-align: left; border: 2px solid var(--line); background: rgba(255,255,255,.04); border-radius: 12px; padding: 12px; display: grid; gap: 4px; min-height: 64px; color: var(--paper); }
.opt[aria-pressed="true"] { border-color: var(--tape); background: rgba(255,210,63,.1); }
.opt b { font-size: 15px; letter-spacing: .04em; }
.opt small { color: var(--muted); font-size: 12.5px; line-height: 1.3; }
.track-list { display: grid; gap: 8px; margin-bottom: 18px; }
.track-opt { grid-template-columns: 56px 1fr auto; align-items: center; gap: 12px; }
.swatch { width: 56px; height: 40px; border-radius: 8px; position: relative; overflow: hidden; }
.swatch::after { content: ""; position: absolute; left: -10%; right: -10%; bottom: 30%; height: 4px; background: rgba(255,255,255,.75); transform: rotate(-12deg); }
.sw-minato { background: linear-gradient(180deg, #05071a, #30235a 70%, #f2c230 70% 74%, #25262c 74%); }
.sw-akane { background: linear-gradient(180deg, #27306e, #ff8a5b 70%, #4c5a2e 70%); }
.sw-piton { background: linear-gradient(180deg, #2f7fd6, #cfe7f3 64%, #1d6f9e 64% 72%, #2f2b29 72%); }
.best { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; text-align: right; }
.best b { display: block; color: var(--paper); font-size: 15px; }
.row-end { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }

/* ---------- atelier ---------- */
#garage { justify-content: flex-end; align-items: stretch; }
#garage .card { width: min(450px, 100%); align-self: stretch; display: flex; flex-direction: column; gap: 10px; padding: 16px; }
.shop-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.shop-head h2 { margin: 0; }
.wallet { font-family: var(--font-display); font-size: 20px; color: var(--ok); background: rgba(10,10,16,.6); border: 1px solid rgba(75,227,138,.35); border-radius: 10px; padding: 6px 12px; font-variant-numeric: tabular-nums; white-space: nowrap; text-shadow: 0 2px 0 #000; }
.wallet-fixed { position: fixed; left: max(16px, env(safe-area-inset-left)); top: max(14px, env(safe-area-inset-top)); z-index: 21; }
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; touch-action: pan-x; flex: none; padding-bottom: 2px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: none; min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.05); color: var(--muted); font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--tape); color: #15130c; border-color: var(--tape); }
.shop-body { flex: 1; min-height: 0; overflow: auto; display: grid; gap: 12px; align-content: start; touch-action: pan-y; overscroll-behavior: contain; padding-right: 2px; }
.shop-body .sub { margin: 0; font-size: 13px; }
.shop-row { display: grid; gap: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { appearance: none; cursor: pointer; min-height: 44px; padding: 5px 10px; border-radius: 10px; border: 2px solid var(--line); background: rgba(255,255,255,.04); display: grid; grid-template-columns: auto 1fr; column-gap: 7px; align-items: center; text-align: left; color: var(--paper); }
.chip b { font-size: 13px; font-weight: 600; grid-column: 2; }
.chip small { font-size: 11.5px; grid-column: 2; font-variant-numeric: tabular-nums; }
.chip .dot { grid-row: 1 / span 2; width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.25); }
.chip .dot.none { background: repeating-linear-gradient(45deg, #333 0 4px, #555 4px 8px); }
.chip[aria-pressed="true"] { border-color: var(--tape); background: rgba(255,210,63,.12); }
.chip.swatch { grid-template-columns: auto; justify-items: center; padding: 5px; min-width: 48px; min-height: 48px; border-radius: 12px; row-gap: 2px; }
.chip.swatch .dot { grid-row: auto; width: 28px; height: 28px; }
.chip.swatch b { display: none; }
.chip.swatch small { grid-column: 1; font-size: 10px; } .chip.swatch small.own { display: none; }
small.own { color: var(--ok); } small.price { color: var(--tape); }
.carpick { appearance: none; cursor: pointer; text-align: left; border: 2px solid var(--line); background: rgba(255,255,255,.04); border-radius: 12px; padding: 10px 12px; display: grid; gap: 4px; color: var(--paper); }
.carpick[aria-pressed="true"] { border-color: var(--tape); background: rgba(255,210,63,.1); }
.carpick small { color: var(--muted); font-size: 12.5px; }
.cp-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; } .cp-head b { font-size: 16px; letter-spacing: .05em; } .cp-head small { font-weight: 700; }
.stats { display: grid; gap: 4px; }
.stat { display: grid; grid-template-columns: 80px 1fr; gap: 10px; align-items: center; font-size: 12.5px; color: var(--muted); }
.sbar { display: flex; height: 8px; border-radius: 4px; background: rgba(255,255,255,.1); overflow: hidden; }
.sbar i { display: block; height: 100%; background: var(--tape); transition: width .25s; }
.sbar i.up { background: var(--ok); }
.perf-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.perf-row b { display: block; font-size: 14px; } .perf-row small { display: block; color: var(--muted); font-size: 12px; }
.pips { display: inline-flex; gap: 4px; margin-top: 4px; } .pips i { width: 18px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.14); } .pips i.on { background: var(--tape); } .pips i.next { background: var(--ok); }
.maxed { font-family: var(--font-display); color: var(--ok); font-size: 16px; }
.rng.tune .ends { display: flex; justify-content: space-between; color: var(--muted); }
.shop-foot { display: flex; gap: 8px; justify-content: flex-end; align-items: center; flex-wrap: wrap; flex: none; }
.shop-foot .btn { min-height: 46px; padding: 0 16px; font-size: 15px; }
.shop-foot .btn.primary { font-size: 16px; min-height: 50px; }
.shop-foot .btn:disabled { opacity: .45; cursor: not-allowed; }
.shop-msg { flex: 1 1 140px; font-size: 13px; color: var(--paper); } .shop-msg.warn { color: var(--tail); }
.shop-foot .btn.compact { min-width: 46px; padding: 0 12px; justify-content: center; }
/* ---------- portefeuille : gains, toasts, carrière ---------- */
#toasts { position: fixed; left: 50%; top: calc(max(12px, env(safe-area-inset-top)) + 56px); transform: translateX(-50%); z-index: 40; display: grid; gap: 6px; justify-items: center; pointer-events: none; width: min(92vw, 520px); }
.toast { background: rgba(14,13,20,.92); border: 1px solid var(--line); border-left: 4px solid var(--ok); border-radius: 10px; padding: 8px 14px; font-weight: 600; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.4); animation: toast 3.2s ease-out forwards; }
.toast.chal { border-left-color: var(--tape); } .toast.buy { border-left-color: var(--apex); }
@keyframes toast { 0% { opacity: 0; transform: translateY(-12px); } 8% { opacity: 1; transform: none; } 85% { opacity: 1; } 100% { opacity: 0; transform: translateY(-6px); } }
.pay { background: rgba(75,227,138,.07); border: 1px solid rgba(75,227,138,.25); border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; display: grid; gap: 4px; }
.pay-lines div { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pay-lines div b { color: var(--paper); font-weight: 600; }
.pay-total { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--line); padding-top: 6px; margin-top: 2px; }
.pay-total span { font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.pay-total b { font-family: var(--font-display); font-weight: 400; font-size: 28px; color: var(--ok); font-variant-numeric: tabular-nums; }
#payChal div { font-size: 13px; color: var(--tape); font-weight: 600; }
.chal-list, .log-list { list-style: none; margin: 6px 0 14px; padding: 0; display: grid; gap: 6px; }
.chal-list li { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; font-size: 14px; background: rgba(255,255,255,.04); border-radius: 10px; padding: 8px 10px; }
.chal-list li .ck { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 12px; }
.chal-list li.done { color: var(--muted); } .chal-list li.done .ck { background: var(--ok); border-color: var(--ok); color: #08210f; }
.chal-list li b { color: var(--tape); font-variant-numeric: tabular-nums; font-size: 13px; } .chal-list li.done b { color: var(--ok); }
.log-list li { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line); padding: 4px 0; }
.log-list li b { font-variant-numeric: tabular-nums; color: var(--ok); } .log-list li b.neg { color: var(--tail); }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper output { font-family: var(--font-display); font-size: 24px; min-width: 52px; text-align: center; font-variant-numeric: tabular-nums; }
.stepper button { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.06); cursor: pointer; font-size: 20px; }
.label { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); font-weight: 700; }

/* ---------- réglages ---------- */
.setting { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.setting:last-of-type { border-bottom: 0; }
.setting p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.setting label { font-weight: 600; }
.toggle { appearance: none; width: 54px; height: 32px; border-radius: 99px; background: rgba(255,255,255,.16); position: relative; cursor: pointer; border: 0; transition: background .15s; }
.toggle::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: var(--paper); transition: transform .15s; }
.toggle:checked { background: var(--ok); }
.toggle:checked::after { transform: translateX(22px); }
.mini-seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.mini-seg button { border: 0; background: transparent; padding: 0 12px; min-height: 40px; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--muted); }
.mini-seg button[aria-pressed="true"] { background: var(--tape); color: #15130c; }

/* ---------- aide ---------- */
.help-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.help-grid div { background: rgba(255,255,255,.05); border-radius: 12px; padding: 12px; font-size: 14px; line-height: 1.4; }
.help-grid b { display: block; color: var(--tape); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 4px; }
@media (max-width: 460px) { .help-grid { grid-template-columns: 1fr; } }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; font-variant-numeric: tabular-nums; }
.hud-top { position: absolute; top: max(10px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left)); right: max(12px, env(safe-area-inset-right)); display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 10px; }
.mm-wrap { display: flex; gap: 10px; align-items: flex-start; }
#minimap { width: 104px; height: 104px; border-radius: 12px; background: rgba(10,10,16,.5); border: 1px solid var(--line); }
.lapinfo { display: grid; gap: 2px; font-size: 13px; color: var(--muted); text-shadow: 0 1px 2px #000; }
.lapinfo b { color: var(--paper); font-size: 18px; }
.total { text-align: center; text-shadow: 0 2px 0 #000; }
.total .num { font-family: var(--font-display); font-size: clamp(26px, 5vw, 40px); line-height: 1; }
.total .lbl { font-size: 11px; letter-spacing: .24em; color: var(--muted); }
.top-right { justify-self: end; display: flex; gap: 8px; pointer-events: auto; }
.icon-btn { width: 48px; height: 48px; border-radius: 12px; border: 1px solid var(--line); background: rgba(10,10,16,.55); display: grid; place-items: center; cursor: pointer; padding: 0; }
.icon-btn svg { width: 22px; height: 22px; fill: var(--paper); }

.combo { position: absolute; left: 50%; top: calc(max(10px, env(safe-area-inset-top)) + 92px); transform: translateX(-50%); text-align: center; transition: opacity .2s; text-shadow: 0 3px 0 #000, 0 0 24px rgba(0,0,0,.6); }
.combo .pts { font-family: var(--font-display); font-size: clamp(32px, 6vw, 56px); color: var(--tape); line-height: 1; }
.combo .mult { display: inline-block; font-weight: 700; font-size: 20px; background: var(--tail); color: #fff; padding: 2px 10px; border-radius: 6px; transform: skewX(-10deg); margin-top: 6px; text-shadow: none; }
.combo .tag { font-size: 12px; letter-spacing: .3em; color: var(--paper); margin-bottom: 4px; }
.anglebar { width: 160px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.15); margin: 8px auto 0; overflow: hidden; }
.anglebar i { display: block; height: 100%; width: 100%; transform: scaleX(0); transform-origin: left center; will-change: transform; background: linear-gradient(90deg, var(--tape), var(--tail)); }
.combo.idle { opacity: 0; }
.combo.warn .pts { color: #ffe9a8; }

#popups { position: absolute; left: max(14px, env(safe-area-inset-left)); top: calc(max(10px, env(safe-area-inset-top)) + 128px); display: grid; justify-items: start; gap: 6px; max-width: 46%; }
.pop { transform-origin: left center; font-weight: 700; font-size: clamp(16px, 3vw, 22px); letter-spacing: .08em; padding: 4px 14px; border-radius: 8px; background: rgba(10,10,16,.6); animation: pop 1.6s ease-out forwards; text-transform: uppercase; }
.pop.clip { color: var(--clip); } .pop.apex { color: var(--apex); } .pop.bank { color: var(--ok); font-family: var(--font-display); font-weight: 400; font-size: clamp(22px, 4.6vw, 34px); background: none; text-shadow: 0 3px 0 #000; }
.pop.lost { color: var(--tail); } .pop.tandem { color: #ff7ad9; }
@keyframes pop { 0% { opacity: 0; transform: translateX(-20px) scale(.9); } 12% { opacity: 1; transform: translateX(0) scale(1.06); } 22% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-14px); } }

.speedo { position: absolute; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); text-align: center; text-shadow: 0 2px 0 #000; }
.speedo .kmh { font-family: var(--font-display); font-size: clamp(28px, 5vw, 42px); line-height: 1; }
.speedo .unit { font-size: 11px; letter-spacing: .2em; color: var(--muted); }
.rpm { width: 150px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.15); margin: 6px auto 0; overflow: hidden; }
.rpm i { display: block; height: 100%; width: 100%; transform: scaleX(0); transform-origin: left center; will-change: transform; background: var(--paper); }
.rpm.red i { background: var(--tail); }
.gear { position: absolute; right: -36px; bottom: 4px; font-family: var(--font-display); font-size: 22px; color: var(--tape); }
.tandem-meter { display: none; margin-top: 4px; gap: 6px; align-items: center; font-size: 12px; letter-spacing: .2em; color: #ff7ad9; text-shadow: 0 1px 2px #000; }
.tandem-meter .tm { width: 70px; height: 6px; background: rgba(255,255,255,.15); border-radius: 3px; overflow: hidden; }
.tandem-meter .tm i { display: block; height: 100%; width: 100%; transform: scaleX(0); transform-origin: left center; background: #ff7ad9; }
.banner { position: absolute; left: 50%; top: 32%; transform: translateX(-50%) skewX(-8deg); font-family: var(--font-display); font-size: clamp(28px, 6vw, 54px); background: var(--tail); color: #fff; padding: 6px 22px; border-radius: 8px; display: none; }
